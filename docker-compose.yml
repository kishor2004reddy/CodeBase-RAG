services:

  # ── Qdrant Vector Database ───────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: coderag-qdrant
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ── Neo4j Graph Database ────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: coderag-neo4j
    ports:
      - "7474:7474"   # HTTP browser UI
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=none                       # no auth for local dev
      - NEO4J_PLUGINS=["apoc"]                # APOC utility procedures
      - NEO4J_dbms_memory_heap_initial__size=256m
      - NEO4J_dbms_memory_heap_max__size=512m
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  # ── FastAPI Backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coderag-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URI=bolt://neo4j:7687
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend:/app
    depends_on:
      - qdrant
      - neo4j
      - redis
    restart: unless-stopped

  # ── React Frontend (dev) ──────────────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: coderag-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend
    restart: unless-stopped

  # ── Redis (Session Memory + LangGraph Checkpointing) ─────────────────────────
  redis:
    image: redis/redis-stack:latest   # redis-stack includes RedisJSON + RediSearch (required by RedisSaver)
    container_name: coderag-redis
    ports:
      - "6379:6379"   # Redis
      - "8001:8001"   # RedisInsight UI — inspect checkpoints at http://localhost:8001
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  qdrant_data:
  neo4j_data:
  redis_data:
